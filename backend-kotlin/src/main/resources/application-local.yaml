spring:
  datasource:
    url: jdbc:h2:mem:movie-search-local;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql

app:
  rate-limit:
    enabled: false
