spring:
    application:
        name: "Fullstack Assignment (Kotlin)"

    datasource:
        url: jdbc:mariadb://localhost:53306/assignment
        username: root
        password:
        hikari:
            maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
            minimum-idle: ${DB_POOL_MIN_IDLE:2}
            connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
            validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
            max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

    jdbc:
        template:
            query-timeout: 3s

server:
    address: ${SERVER_ADDRESS:127.0.0.1}
    max-http-request-header-size: 8KB
    compression:
        enabled: true
        min-response-size: 1KB
        mime-types: application/json,application/problem+json,text/html,text/css,application/javascript
    error:
        include-message: never
        include-binding-errors: never
        include-stacktrace: never
        include-exception: false
    tomcat:
        max-connections: ${SERVER_MAX_CONNECTIONS:500}
        accept-count: ${SERVER_ACCEPT_COUNT:100}
        max-parameter-count: 20
        max-http-form-post-size: 16KB
        max-swallow-size: 16KB
        threads:
            max: ${SERVER_MAX_THREADS:100}
            min-spare: ${SERVER_MIN_SPARE_THREADS:10}

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: ${OPENAPI_ENABLED:true}
    swagger-ui:
        path: /swagger-ui.html
        enabled: ${SWAGGER_UI_ENABLED:true}
        operations-sorter: method
        tags-sorter: alpha
        try-it-out-enabled: true

app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limit:
        enabled: ${RATE_LIMIT_ENABLED:true}
        capacity: ${RATE_LIMIT_CAPACITY:60}
        refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:60}
        refill-period: ${RATE_LIMIT_REFILL_PERIOD:PT1M}
        cache-max-size: ${RATE_LIMIT_CACHE_MAX_SIZE:100000}
        cache-expire-after-access: ${RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:PT1H}
